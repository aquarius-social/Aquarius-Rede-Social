name: Backfill de detalhe de matéria do Senado (situação/tema)

# Enriquece as matérias do Senado (tabela proposicao, casa_origem='senado') com
# situacao (/materia/situacaoatual/{cod}) e tema (/materia/{cod} IndexacaoMateria).
# Par do backfill-proposicao-detalhe (Câmara). API do Senado é outro host, sem o
# throttle da Câmara. Matriz por ano; RESUMÍVEL, idempotente. Disparo manual.
on:
  workflow_dispatch:
    inputs:
      anos:
        description: 'Anos a rodar (array JSON). Padrão = 2018–2026.'
        type: string
        default: '["2018","2019","2020","2021","2022","2023","2024","2025","2026"]'

concurrency:
  group: backfill-materia-detalhe-senado
  cancel-in-progress: false

jobs:
  detalhe:
    name: Detalhe matéria Senado ${{ matrix.ano }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        ano: ${{ fromJSON(github.event.inputs.anos) }}
    defaults:
      run:
        working-directory: codigo/services/ingestao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências de runtime
        run: pip install -r requirements.txt

      - name: Detalhe de matéria do Senado — ano ${{ matrix.ano }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AQUARIUS_PROP_ANO: ${{ matrix.ano }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::notice::Secrets ausentes — pulado (workflow segue verde)."
            exit 0
          fi
          echo "::notice::Detalhe de matéria do Senado ${{ matrix.ano }}"
          python run_materia_detalhe_senado.py
