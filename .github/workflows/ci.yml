name: CI

# Fecha a exigência de "build e CI verdes" da Onda 0. Roda a cada push e PR de
# CÓDIGO. Push que só mexe em documentação (*.md) NÃO dispara CI — economiza
# minutos do plano free do GitHub Actions.
on:
  push:
    paths-ignore:
      - '**.md'
      - '.gitattributes'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  testes-python:
    name: Testes Python (sem rede)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Suítes sem dependências externas: HTTP e banco são injetados (dubles).
      # Nada de pip install — é deliberado. Um runner só, dois serviços.
      - name: Ingestão
        working-directory: codigo/services/ingestao
        run: python -m unittest discover -s . -t .
      - name: Prometeus
        working-directory: codigo/services/prometeus
        run: python -m unittest discover -s . -t .

  typecheck-ts:
    name: Type-check dos pacotes TypeScript
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pacote: [types, ui]
    defaults:
      run:
        working-directory: codigo/packages/${{ matrix.pacote }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx tsc --noEmit

  checks-apps:
    # Roda tsc + ESLint do app (Expo) e do admin (Next) na nuvem — a maquina de dev
    # tem RAM limitada e o tsc local concorre com o Metro. Aqui roda folgado.
    name: Checks dos apps (tsc + lint)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [app, admin]
    defaults:
      run:
        working-directory: codigo/apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
