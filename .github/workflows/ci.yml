name: CI

# Fecha a exigência de "build e CI verdes" da Onda 0. Roda a cada push e PR.
on:
  push:
  pull_request:

jobs:
  testes-python:
    name: Testes da ingestão (Python, sem rede)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codigo/services/ingestao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # A suíte não tem dependências externas: HTTP e banco são injetados,
      # os testes usam dubles. Nada de pip install aqui — é deliberado.
      - name: Rodar a suíte
        run: python -m unittest discover -s . -t .

  typecheck-ts:
    name: Type-check dos pacotes TypeScript
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pacote: [types, ui]
    defaults:
      run:
        working-directory: codigo/packages/${{ matrix.pacote }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx tsc --noEmit

  checks-apps:
    # Roda tsc + ESLint do app (Expo) e do admin (Next) na nuvem — a maquina de dev
    # tem RAM limitada e o tsc local concorre com o Metro. Aqui roda folgado.
    name: Checks dos apps (tsc + lint)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [app, admin]
    defaults:
      run:
        working-directory: codigo/apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
