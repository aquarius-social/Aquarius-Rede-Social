name: Debug tramitações

# Diagnóstico pontual do 'tramitacoes=0'. Só disparo manual. Descartável.
on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codigo/services/ingestao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Diagnóstico
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python debug_tramitacao.py
