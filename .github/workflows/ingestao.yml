name: Ingestão da Câmara

# Extrai das APIs abertas, trata pela metodologia (bronze → prata) e persiste
# no Supabase. A leitura na plataforma é sempre da nossa base (camada ouro),
# nunca da fonte ao vivo.
#
# CADÊNCIA POR VOLATILIDADE (§3.3): o que muda todo dia (proposições, votações,
# tramitações + os perfis, que são baratos) roda 2×/dia — rodada LEVE. O que
# muda pouco e é caro (histórico de mandatos e despesas, ~1 chamada por deputado)
# roda 1×/semana — rodada COMPLETA. O disparo manual deixa escolher.
#
# Cron do GitHub Actions é em UTC:
#   09:00 UTC = 06:00 São Paulo — diário leve (manhã)
#   21:00 UTC = 18:00 São Paulo — diário leve (tarde)
#   06:00 UTC dom = 03:00 São Paulo dom — semanal completo
on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 21 * * *'
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      completo:
        description: 'Rodada COMPLETA (histórico + despesas + enriquecimento por deputado)? Deixe desmarcado para uma rodada leve e rápida.'
        type: boolean
        default: false

concurrency:
  group: ingestao-camara
  cancel-in-progress: false

jobs:
  ingerir:
    name: Rodar a ingestão
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codigo/services/ingestao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências de runtime
        run: pip install -r requirements.txt

      - name: Definir modo (leve × completo)
        id: modo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COMPLETO="${{ github.event.inputs.completo }}"
          elif [ "${{ github.event.schedule }}" = "0 6 * * 0" ]; then
            COMPLETO="true"    # semanal de domingo = completo
          else
            COMPLETO="false"   # diário = leve
          fi
          echo "completo=$COMPLETO" >> "$GITHUB_OUTPUT"
          echo "::notice::Rodada $( [ "$COMPLETO" = "true" ] && echo COMPLETA || echo LEVE )"

      - name: Ingestão
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AQUARIUS_JANELA_DIAS: '30'
          AQUARIUS_HISTORICO: ${{ steps.modo.outputs.completo }}
          AQUARIUS_DESPESAS: ${{ steps.modo.outputs.completo }}
          AQUARIUS_ENRIQUECER: ${{ steps.modo.outputs.completo }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::notice::Secrets do Supabase ausentes — ingestão pulada (workflow segue verde)."
            exit 0
          fi
          python run_ingestao.py

# PRÉ-REQUISITO (uma vez, fora deste workflow): aplicar as migrations 0001–0008
# ao projeto Supabase (SQL Editor com deploy_all.sql, ou Supabase CLI).
